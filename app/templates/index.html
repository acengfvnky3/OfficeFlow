<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OfficeFlow</title>
  <style>
    :root {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f4f7fb;
    }
    body { margin: 0; }
    header {
      background: #172033;
      color: white;
      padding: 28px 7%;
    }
    main { max-width: 1100px; margin: 32px auto; padding: 0 20px; }
    .card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 5px 18px rgba(15, 23, 42, .05);
    }
    form { display: grid; gap: 12px; }
    input, textarea, select, button {
      box-sizing: border-box;
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font: inherit;
    }
    textarea { min-height: 90px; resize: vertical; }
    button {
      cursor: pointer;
      background: #172033;
      color: white;
      border: 0;
    }
    .task {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 15px 0;
      border-bottom: 1px solid #e5e7eb;
    }
    .task:last-child { border-bottom: 0; }
    .meta { color: #64748b; font-size: .9rem; }
    .badge { font-size: .8rem; font-weight: 700; }
    .actions { min-width: 160px; }
  </style>
</head>
<body>
<header>
  <strong>OfficeFlow</strong>
  <div>Office productivity and workflow management</div>
</header>

<main>
  <section class="card">
    <h2>Create Task</h2>
    <form id="task-form">
      <input id="title" placeholder="Task title" maxlength="200" required>
      <textarea id="description" placeholder="Description"></textarea>
      <select id="priority">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
        <option value="urgent">Urgent</option>
      </select>
      <input id="due-date" type="date">
      <button type="submit">Add Task</button>
    </form>
  </section>

  <section class="card">
    <h2>Tasks</h2>
    <div id="tasks">Loading...</div>
  </section>
</main>

<script>
async function loadTasks() {
  const response = await fetch("/api/tasks");
  const tasks = await response.json();
  const container = document.getElementById("tasks");

  if (!tasks.length) {
    container.innerHTML = "<p>No tasks yet.</p>";
    return;
  }

  container.innerHTML = tasks.map(task => {
    const due = task.due_date ? "Due: " + task.due_date : "No due date";
    return `
      <div class="task">
        <div>
          <strong>${escapeHtml(task.title)}</strong>
          <div class="meta">${escapeHtml(task.description || "")}</div>
          <div class="meta">${due}</div>
        </div>
        <div class="actions">
          <div class="badge">${task.priority.toUpperCase()}</div>
          <select onchange="updateStatus(${task.id}, this.value)">
            <option value="pending" ${task.status === "pending" ? "selected" : ""}>Pending</option>
            <option value="in_progress" ${task.status === "in_progress" ? "selected" : ""}>In Progress</option>
            <option value="completed" ${task.status === "completed" ? "selected" : ""}>Completed</option>
          </select>
          <button onclick="deleteTask(${task.id})">Delete</button>
        </div>
      </div>
    `;
  }).join("");
}

async function createTask(event) {
  event.preventDefault();

  const payload = {
    title: document.getElementById("title").value,
    description: document.getElementById("description").value || null,
    priority: document.getElementById("priority").value,
    due_date: document.getElementById("due-date").value || null
  };

  const response = await fetch("/api/tasks", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(payload)
  });

  if (!response.ok) {
    alert("Unable to create task.");
    return;
  }

  event.target.reset();
  document.getElementById("priority").value = "medium";
  await loadTasks();
}

async function updateStatus(id, status) {
  await fetch(`/api/tasks/${id}/status`, {
    method: "PATCH",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({status})
  });
  await loadTasks();
}

async function deleteTask(id) {
  if (!confirm("Delete this task?")) return;
  await fetch(`/api/tasks/${id}`, {method: "DELETE"});
  await loadTasks();
}

function escapeHtml(value) {
  return value.replace(/[&<>"']/g, char => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;",
    '"': "&quot;", "'": "&#039;"
  }[char]));
}

document.getElementById("task-form").addEventListener("submit", createTask);
loadTasks();
</script>
</body>
</html>
